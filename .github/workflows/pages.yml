# .github/workflows/pages.yml
name: pages
on:
  # docs/ now exists and the site builds, so auto-deploy on pushes that touch
  # the docs tree or this workflow. Manual runs stay available too.
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/pages.yml']
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages          # deploy-pages FAILS without this. Not optional.
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs-material
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
