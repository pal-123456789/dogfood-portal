# .github/workflows/pages.yml
name: pages
on:
  # Manual-only until the docs/ tree exists AND Pages is enabled
  # (repo Settings > Pages > Source: GitHub Actions). Flip back to
  # `push: {branches: [main]}` in the commit that lands docs/.
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages          # deploy-pages FAILS without this. Not optional.
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs-material
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
