# mkdocs.yml
site_name: DOGFOOD Portal
theme:
  name: material
docs_dir: docs
nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Data model: DATA-MODEL.md
  - Judging: JUDGING.md
  - Ablation: ABLATION.md
  - Threat model: THREAT-MODEL.md
markdown_extensions:
  # Render ```mermaid blocks as diagrams (pymdownx ships with mkdocs-material).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
