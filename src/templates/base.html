{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dogfood Portal{% endblock %}</title>
  <style>
    :root{
      --ink:#161a1d; --muted:#5b6670; --line:#e3e1d8; --paper:#f7f5ef;
      --card:#fffdf7; --accent:#0f7d6b; --accent-ink:#0a5a4d; --chip:#ece9df;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:var(--accent-ink);text-decoration:none}
    a:hover{text-decoration:underline}
    code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
    .wrap{max-width:980px;margin:0 auto;padding:0 20px}
    header.site{border-bottom:1px solid var(--line);background:var(--card)}
    header.site .wrap{display:flex;align-items:baseline;gap:14px;padding:18px 20px}
    header.site .brand{font-weight:700;letter-spacing:-.02em;font-size:1.15rem}
    header.site .brand b{color:var(--accent)}
    header.site nav{margin-left:auto;display:flex;gap:18px;font-size:.95rem}
    .lede{padding:26px 0 6px}
    .lede h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
    .lede p{margin:0;color:var(--muted)}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
    .chip{display:inline-block;padding:4px 11px;border:1px solid var(--line);border-radius:999px;
      background:var(--chip);color:var(--muted);font-size:.85rem}
    .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:8px 0 40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px}
    .card h3{margin:0 0 6px;font-size:1.06rem;letter-spacing:-.01em}
    .card .sum{color:var(--muted);font-size:.92rem;margin:0 0 12px;min-height:1.2em}
    .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
    .tag{background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--muted)}
    .empty{color:var(--muted);padding:30px 0}
    footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
    footer.site .wrap{padding:18px 20px}
    form.stack{max-width:560px;margin:10px 0 40px}
    label{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 4px}
    input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
      background:var(--card);font:inherit;color:inherit}
    button{margin-top:18px;background:var(--accent);color:#fff;border:0;border-radius:8px;
      padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
    .notice{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:12px 14px;color:var(--muted)}
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <span class="brand"><b>dogfood</b> portal</span>
      <nav>
        <a href="/projects">Projects</a>
        <a href="/projects/new">Submit</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <div class="wrap">Self-hostable hackathon submission &amp; judging platform.</div>
  </footer>
</body>
</html>
