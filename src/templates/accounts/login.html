{% extends "base.html" %}
{% block title %}Sign in · Dogfood Portal{% endblock %}
{% block content %}
  <section class="lede">
    <h1>Sign in</h1>
    <p>For organizers, judges and participants. The evaluation stack uses a demo cookie instead.</p>
  </section>
  {% if error %}<p class="notice">{{ error }}</p>{% endif %}
  <form class="stack" method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
